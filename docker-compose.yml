services:
  nas-streamlit:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: nas_gpu_platform
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_PORT: "8501"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/workspace/nas_gpu_project/data
      - ./search_checkpoints:/workspace/nas_gpu_project/search_checkpoints
      - ./eval_checkpoints:/workspace/nas_gpu_project/eval_checkpoints
      - ./streamlit_runtime:/workspace/nas_gpu_project/streamlit_runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
