name: Feature request
description: Suggest an improvement to the NAS search, evaluation, dashboard, or deployment workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow, limitation, or research use case should this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected behavior and any relevant config or API changes.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: How should this be tested or measured?
      placeholder: Unit test, smoke run, GPU run, dashboard check, or deployment check.
    validations:
      required: false
