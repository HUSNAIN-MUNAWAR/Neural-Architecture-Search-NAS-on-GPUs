[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nas-gpu-platform"
version = "0.1.0"
description = "GPU-aware DARTS Neural Architecture Search platform with Streamlit and Docker deployment."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Husnain Munawar"}]
keywords = ["automl", "nas", "darts", "pytorch", "streamlit", "cuda", "mlops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["data*", "models*", "search*", "evaluation*", "streamlit_app*", "utils*", "scripts*"]

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = ["data", "search_checkpoints", "eval_checkpoints", "streamlit_runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q -m 'not gpu'"
testpaths = ["tests"]
markers = [
  "gpu: tests that require CUDA GPU hardware",
  "slow: tests that are too slow for default CI",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
